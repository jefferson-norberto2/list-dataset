[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-curator"
version = "0.1.0"
description = "Modular, production-ready Python tool to filter and curate pristine reference image datasets."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Computer Vision Data Engineer" }
]
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
    "pyiqa>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
curate-dataset = "dataset_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
